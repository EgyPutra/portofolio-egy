name: Terbitkan website Nuri
run-name: Publikasi Nuri ${{ github.event.client_payload.publication_id }}
on:
  repository_dispatch:
    types: [nuri-publish]
permissions:
  contents: read
concurrency:
  group: nuri-publication-${{ github.event.client_payload.publication_id }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bisnis-bareng-nuri
    env:
      PUBLICATION_ID: ${{ github.event.client_payload.publication_id }}
      PUBLICATION_URL: ${{ vars.PUBLICATION_URL }}
      BUILD_READ_TOKEN: ${{ secrets.BUILD_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_STUDIO_URL: ${{ vars.NEXT_PUBLIC_STUDIO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/publish-ci.mjs
